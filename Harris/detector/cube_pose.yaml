%YAML:1.0
---
# =============================================================================
#  cube_pose 配置文件（全部参数都在这里，不用改代码）
#  改完直接跑： ./cube_pose --config cube_pose.yaml image.jpg
#  代码里用：   det.loadConfig("cube_pose.yaml");  det.detect(frame, roi);
# =============================================================================

# ---------- 立方体实物 ----------
# 实物边长(m)。【必须按实物改】它决定距离/平面坐标的绝对尺度：
# 填错一倍，所有距离和平面距离都会错一倍（像素误差不变）。
cubeSize: 0.05

# 相机向下俯仰角(度)。只用于判断"哪个面朝上"。
# 相机大致水平 -> 0~10；俯视桌面 30~45 都可以。有 IMU 的话可以改成用重力方向。
tiltDeg: 20

# ---------- ROI（YOLO 检测框）----------
# 填 0 表示不使用固定 ROI，程序会全图搜索 + 自动候选区域重试。
# 用 YOLO 时建议代码里直接传 detect(frame, roi)，比写死在 yaml 里灵活。
roi_x: 0
roi_y: 0
roi_w: 0
roi_h: 0

# ROI 自动外扩比例。YOLO 框通常贴得很紧，不加外扩会把立方体轮廓切掉，
# 表现就是"顶点数不是 6"或重投影 RMS 突然变大。0.15~0.25 比较合适。
roiPad: 0.15

# 没有 ROI 时是否自动找候选区域（1=开 0=关）
autoRoi: 1

# ---------- 分割（把立方体从背景里分出来）----------
# 0=自动在下面 4 种里选优  1=Otsu 2=自适应阈值 3=Canny+闭运算 4=Lab色差
# 现场如果知道哪种稳，就写死一个，省一半时间
segMode: 0
# 目标比背景暗时置 1（只对 segMode=1 生效）
invert: 0
# 轮廓面积 / ROI 面积 的下限，用来滤掉小噪点
minAreaRatio: 0.02

# ---------- 轮廓 -> 直线段 ----------
# 直线拆分残差阈值(px)：越小越敏感（可能把一个角切成两段），越大越迟钝
splitTol: 1.2
# 直线段最短长度(px)，比它短的当成噪声丢掉
minRunLen: 12
# 相邻直线段方向差小于该值(度)就合并
mergeAngleDeg: 12

# ---------- 亚像素精化 ----------
subpix: 1
subpixRange: 2.5

# ---------- 相机内参 ----------
# 【强烈建议标定】不填则按 fx=fy=W/(2*tan30) 粗估，绝对距离不可信。
# 标定后把数值填这里，或填 calibFile 指向 OpenCV 标定 yaml。
fx: 0
fy: 0
cx: 0
cy: 0
calibFile: ""

# ---------- 调试 ----------
# 1 = 结果里带上调试图 result.debugImage（画了掩膜/顶点编号/三个可见面）
buildDebugImage: 0
# 非空 = detect() 顺便把调试图写到这个路径
debugPath: ""
# 1 = 打印各分割候选与拟合诊断（现场调参用）
verbose: 0
